<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klarspråk — granskningskö</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f1;--card:#fff;--text:#1b2422;--muted:#5b625f;--line:#d8dad3;--accent:#2d3f69;--danger:#8a2e2e;--ok:#2f6a47}
@media(prefers-color-scheme:dark){:root{--bg:#12161a;--card:#191e23;--text:#e9e7df;--muted:#a9afa8;--line:#2a3138;--accent:#9aaddc;--danger:#ed8d8d;--ok:#82c99d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}.wrap{max-width:900px;margin:auto;padding:2.5rem 1.2rem 5rem}h1,h2{font-family:Georgia,serif;font-weight:400}h1{margin:0 0 .5rem}.sub{color:var(--muted);margin:0 0 1.5rem}.auth,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}input,textarea,button{font:inherit}input,textarea{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:7px;padding:.6rem .7rem}.auth input{flex:1 1 280px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:7px;padding:.55rem .8rem;cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.reject{border-color:var(--danger);color:var(--danger)}.meta{font-size:.78rem;color:var(--muted);margin-bottom:.7rem}.label{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:.7rem}.value{white-space:pre-wrap;margin:.2rem 0 .5rem}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.note{width:100%;min-height:70px}.status{font-size:.85rem;color:var(--muted);margin:.8rem 0}.empty{padding:2rem;text-align:center;color:var(--muted)}a{color:var(--accent)}
</style>
</head>
<body>
<main class="wrap">
<h1>Klarspråk — granskningskö</h1>
<p class="sub">Förslag ska bedömas mot den nya modellen: allmänspråklig källa + institutionell källa + tydligt beskriven skillnad. Fältens interna databasnamn är äldre men innehållet ska bedömas enligt denna modell.</p>
<section class="auth">
  <div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><button class="btn primary" id="load" type="button">Ladda kö</button><a href="/">Till startsidan</a></div>
  <div class="status" id="status">Token sparas endast i sessionStorage för denna flik.</div>
</section>
<section id="queue"></section>
</main>
<script>
const tokenEl=document.querySelector('#token');const statusEl=document.querySelector('#status');const queue=document.querySelector('#queue');
tokenEl.value=sessionStorage.getItem('klarsprak-admin-token')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function auth(){const t=tokenEl.value.trim();if(!t)throw new Error('Admin-token saknas.');sessionStorage.setItem('klarsprak-admin-token',t);return {'authorization':`Bearer ${t}`};}
async function load(){
  statusEl.textContent='Laddar…';queue.innerHTML='';
  try{const r=await fetch('/api/admin/queue',{headers:auth()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);render(d.submissions||[]);statusEl.textContent=`${(d.submissions||[]).length} väntande förslag.`;}catch(e){statusEl.textContent=e.message||String(e);}
}
function field(label,value){if(!value)return'';return `<div class="label">${esc(label)}</div><div class="value">${esc(value)}</div>`;}
function render(items){
  if(!items.length){queue.innerHTML='<div class="empty">Kön är tom.</div>';return;}
  queue.innerHTML=items.map(x=>`<article class="card" data-id="${esc(x.id)}"><h2>${esc(x.term)}</h2><div class="meta">#${esc(x.id)} · ${esc(x.foreslaget_rattsomrade||'inget rättsområde')} · ${esc(x.created_at||'')}</div>${field('Allmänspråklig betydelse (legacy-fält: foreslagen_vardagsbetydelse)',x.foreslagen_vardagsbetydelse)}${field('Myndighetens/juridikens användning (legacy-fält: foreslagen_juridisk_definition)',x.foreslagen_juridisk_definition)}${field('Källor / exempel',x.foreslagen_exempel)}${field('Inskickare',x.inskickare_namn)}${field('Kommentar',x.inskickare_kommentar)}<textarea class="note" placeholder="Granskningsanteckning (valfritt)"></textarea><div class="actions"><button class="btn primary" data-action="approve" type="button">Godkänn</button><button class="btn reject" data-action="reject" type="button">Avslå</button></div></article>`).join('');
}
queue.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const card=b.closest('[data-id]');const id=card.dataset.id;const action=b.dataset.action;const note=card.querySelector('.note').value.trim();b.disabled=true;try{const r=await fetch(`/api/admin/review/${encodeURIComponent(id)}`,{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({action,note})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);card.remove();statusEl.textContent=`Förslag #${id}: ${action==='approve'?'godkänt':'avslaget'}.`;}catch(err){statusEl.textContent=err.message||String(err);b.disabled=false;}});
document.querySelector('#load').addEventListener('click',load);tokenEl.addEventListener('keydown',e=>{if(e.key==='Enter')load();});
</script>
</body>
</html>
