name: Deploy

# Auto-deploy till Cloudflare Workers vid push till main. Enkel statisk
# assets-worker (public/index.html) — inget build-steg, bara wrangler deploy.
#
# Secrets (Repo → Settings → Environments → produktion):
#   KLARSPRAK — Cloudflare API-token. Workers Scripts:Edit.
#     Environment secret på miljön produktion, inte på repo-nivå.
#     Har INTE zonbehörighet ("Zone → Workers Routes → Edit"), vilket är
#     varför wrangler.jsonc saknar en routes-post och varför kontrollen
#     längre ned finns. Får den behörigheten går båda att ändra tillbaka.
#
# Variables (Repo → Settings → Variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID    — kontots ID. Variabel, inte secret: det är ingen
#                              hemlighet, och som secret maskeras det i loggarna
#                              vilket bara försvårar felsökning.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Standardtokens rättigheter behöver inte vara vidare än checkout:
# wrangler autentiserar med CLOUDFLARE_API_TOKEN, inte med GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Grinden för produktionsdeploy ligger i miljön, inte i den här filen:
    # deployment branch policy släpper bara main, och KLARSPRAK
    # är ett environment secret. En körning på dev får därför ingen token.
    environment: produktion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KLARSPRAK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Att `wrangler deploy` lyckas betyder att WORKERN finns — inte att
      # SAJTEN går att nå. Skillnaden är inte teoretisk: 2026-08-17 var
      # workern deployad och frisk medan klarsprak.denied.se saknade
      # DNS-post helt (Cloudflare svarade NODATA) och var oåtkomlig i
      # timmar, utan att något i CI sade ifrån.
      #
      # Domänen kan inte ägas av wrangler.jsonc — KLARSPRAK-tokenen saknar
      # zonbehörighet, se kommentaren där. Det här är kontrollen i stället.
      #
      # VARFÖR DEN INTE KRÄVER 200: Cloudflares botskydd svarar 403 på
      # anrop från datacenter-IP:n, och GitHubs runners är just det.
      # Uppmätt 2026-08-18: fem raka 403 från runnern medan sajten
      # samtidigt gav 200 från en vanlig klient. En kontroll som kräver
      # 200 hade alltså failat varje körning av fel skäl — samma fälla som
      # routes-posten, fast tvärtom.
      #
      # Det som FAKTISKT gick sönder 2026-08-17 var att domänen inte fanns:
      # ingen DNS-post, ingenting att ansluta till. Kontrollen riktar sig
      # mot exakt det, i två steg som båda är omöjliga att förfalska med
      # ett WAF-svar:
      #
      #   1. domänen ska slå upp till en adress
      #   2. någon ska svara på HTTPS — vilken statuskod som helst duger
      #      som bevis på att en edge finns, utom 5xx som betyder att
      #      edgen finns men är trasig
      #
      # Statuskoden skrivs ut oavsett, så en människa ser skillnad på 200
      # och 403 i loggen utan att jobbet blir rött för det.
      - name: Kontrollera att domänen lever
        run: |
          set -uo pipefail
          host="klarsprak.denied.se"

          if ! getent hosts "$host" > /dev/null; then
            echo "::error::$host har ingen DNS-post — custom domain-kopplingen är borta, sajten är oåtkomlig"
            exit 1
          fi
          echo "DNS: $(getent hosts "$host" | head -1)"

          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo 000)
            case "$code" in
              000)
                echo "försök $attempt: ingen HTTPS-respons alls"
                ;;
              5*)
                echo "försök $attempt: edgen svarade $code"
                ;;
              *)
                echo "$host svarade $code — edgen lever (försök $attempt)"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::$host har DNS men ingen fungerande edge efter fem försök"
          exit 1
