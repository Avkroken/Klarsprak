name: Deploy

# Auto-deploy till Cloudflare Workers vid push till main. Enkel statisk
# assets-worker (public/index.html) — inget build-steg, bara wrangler deploy.
#
# Secrets (Repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN     — Workers Scripts:Edit
#
# Variables (Repo → Settings → Variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID    — kontots ID. Variabel, inte secret: det är ingen
#                              hemlighet, och som secret maskeras det i loggarna
#                              vilket bara försvårar felsökning.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Säkerhetsnät: auto-merge-boten (Bot Auto-Merge) mergar claude/-PR:ar med
    # standard-GITHUB_TOKEN, vilket GitHub inte låter trigga push-workflows.
    # Utan detta blir mergad kod tyst odeployad. wrangler deploy är
    # idempotent, så en periodisk körning kostar inget om main redan är live.
    - cron: '*/30 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Grinden för produktionsdeploy ligger i miljön, inte i den här filen:
    # deployment branch policy släpper bara main, och CLOUDFLARE_API_TOKEN
    # är ett environment secret. En körning på dev får därför ingen token.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
