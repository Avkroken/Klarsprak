name: Validate Worker and D1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Blockera ofärdig Codex-remediation
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.github/codex-dispatch/issue-*.md' > /dev/null; then
            echo '::error::Codex-remediation innehåller fortfarande en tillfällig seed-fil. Implementera och verifiera fixen och ta bort seed-filen före merge.'
            find .github/codex-dispatch -maxdepth 1 -type f -name 'issue-*.md' -print
            exit 1
          fi

      - name: Setup Bun
        run: npm install --global bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run regression tests
        run: bun run test

      - name: Validate D1 migrations from empty database
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          shopt -s nullglob
          migrations=(migrations/*.sql)
          if (( ${#migrations[@]} == 0 )); then
            echo "No D1 migrations found" >&2
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            bunx wrangler d1 execute klarsprak-db --local --file "${migration}"
          done

      - name: Validate Worker bundle and Wrangler config
        run: bunx wrangler deploy --dry-run --outdir .wrangler/dry-run
