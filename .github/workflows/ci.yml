name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject incomplete remediation seeds
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.github/codex-dispatch/issue-*.md' > /dev/null; then
            echo '::error::Incomplete remediation seed remains in the pull request.'
            find .github/codex-dispatch -maxdepth 1 -type f -name 'issue-*.md' -print
            exit 1
          fi
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Validate migrations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          shopt -s nullglob
          migrations=(migrations/*.sql)
          if (( ${#migrations[@]} == 0 )); then
            echo "::error::No D1 migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            bunx wrangler d1 execute klarsprak-db --local --file "$migration"
          done
      - run: bunx wrangler deploy --dry-run --outdir .wrangler/dry-run
