name: OSV

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-preflight:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject unsafe OSV result paths
        shell: bash
        run: |
          set -euo pipefail
          unsafe="$(find . -maxdepth 1 -type l \( -name '*old-results.json' -o -name '*new-results.json' -o -name '*results.sarif' \) -print -quit)"
          if [[ -n "$unsafe" ]]; then
            echo "::error::Reserved OSV result path must not be a symlink: ${unsafe#./}"
            exit 1
          fi

  scan-pr:
    if: github.event_name == 'pull_request'
    needs: [osv-preflight]
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # fail closed when a scan does not complete
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-merge-group:
    if: github.event_name == 'merge_group'
    needs: [osv-preflight]
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: true
      upload-sarif: false

  scan-main:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: false

  osv:
    name: osv
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs: [osv-preflight, scan-pr, scan-merge-group]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Verify OSV gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_RESULT: ${{ needs.osv-preflight.result }}
          PR_RESULT: ${{ needs.scan-pr.result }}
          MERGE_GROUP_RESULT: ${{ needs.scan-merge-group.result }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RESULT" == "success" ]] || { echo "::error::OSV preflight: $PREFLIGHT_RESULT"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_RESULT" == "success" ]] || { echo "::error::OSV PR scan: $PR_RESULT"; exit 1; }
          else
            [[ "$MERGE_GROUP_RESULT" == "success" ]] || { echo "::error::OSV merge-group scan: $MERGE_GROUP_RESULT"; exit 1; }
          fi
